
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Michi - Tres en Raya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">

        <header>
            <span class="etiqueta">JUEGO CLÁSICO</span>
            <h1>Mich<span>i</span> ✨</h1>
            <p>¡Pon a prueba tu estrategia!</p>
        </header>

        <section class="marcador">
            <div class="jugador activo" id="jugadorX">
                <span class="simbolo">X</span>
                <p>Jugador 1</p>
                <h2 id="puntosX">0</h2>
            </div>

            <div class="jugador" id="jugadorO">
                <span class="simbolo">O</span>
                <p>Jugador 2</p>
                <h2 id="puntosO">0</h2>
            </div>
        </section>

        <section class="juego">
            <h3 id="mensaje">Turno del jugador X</h3>

            <div class="tablero" id="tablero">
                <button class="celda" data-index="0"></button>
                <button class="celda" data-index="1"></button>
                <button class="celda" data-index="2"></button>
                <button class="celda" data-index="3"></button>
                <button class="celda" data-index="4"></button>
                <button class="celda" data-index="5"></button>
                <button class="celda" data-index="6"></button>
                <button class="celda" data-index="7"></button>
                <button class="celda" data-index="8"></button>
            </div>

            <button class="btn-reiniciar" id="reiniciar">
                ↻ Nueva partida
            </button>

            <button class="btn-limpiar" id="limpiar">
                Reiniciar marcador
            </button>
        </section>

        <footer>
            <p>Diseñado para divertirse 💙</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
